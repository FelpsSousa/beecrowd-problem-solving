name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the checks only need to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate, lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Toolchain versions
        run: |
          g++ --version | head -n 1
          gcc --version | head -n 1
          rustc --version
          node --version
          python --version

      - name: Run every check
        run: python scripts/check_all.py --all --sanitize --werror --require-toolchains --github
